<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codux.fun | Backend Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid #27272a; }
        .input-field { width: 100%; background: #09090b; border: 1px solid #27272a; border-radius: 0.5rem; padding: 0.75rem; color: white; margin-bottom: 1rem; }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-10">
            <h1 class="text-3xl font-bold">Codux <span class="text-zinc-500">Works Console</span></h1>
        </div>

        <div class="grid md:grid-cols-3 gap-8">
            <div class="glass-card p-6 rounded-2xl h-fit">
                <h2 class="text-xl font-semibold mb-6">Add New Project</h2>
                <form id="uploadForm">
                    <input type="text" id="projectName" placeholder="Project Name" class="input-field" required>
                    <textarea id="description" placeholder="Description" rows="3" class="input-field" required></textarea>
                    <input type="url" id="liveUrl" placeholder="Live URL (e.g., https://...)" class="input-field">
                    <input type="url" id="videoUrl" placeholder="Video URL (Optional)" class="input-field">
                    
                    <label class="block text-sm text-zinc-400 mb-2">Thumbnail Image</label>
                    <input type="file" id="thumbnail" accept="image/*" class="input-field" required>
                    
                    <button type="submit" id="submitBtn" class="w-full bg-white text-black font-semibold py-3 rounded-lg hover:bg-zinc-200 transition">
                        Deploy Project to Database
                    </button>
                    <p id="statusMsg" class="mt-4 text-sm text-center font-medium"></p>
                </form>
            </div>

            <div class="md:col-span-2 glass-card p-6 rounded-2xl">
                <h2 class="text-xl font-semibold mb-6">Active Database Records</h2>
                <div id="projectsGrid" class="grid sm:grid-cols-2 gap-4">
                    <p class="text-zinc-500">Loading signals...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://coduxdotfun-admin-dashboard.onrender.com/api/works';

        async function fetchWorks() {
            const grid = document.getElementById('projectsGrid');
            try {
                const res = await fetch(API_URL);
                const works = await res.json();
                grid.innerHTML = '';
                
                if(works.length === 0) {
                    grid.innerHTML = '<p class="text-zinc-500 col-span-2">No projects found in database.</p>';
                    return;
                }

                works.forEach(work => {
                    grid.innerHTML += `
                        <div class="bg-black border border-zinc-800 rounded-xl overflow-hidden group">
                            <div class="h-40 bg-zinc-900 w-full overflow-hidden relative">
                                ${work.thumbnail_url ? `<img src="${work.thumbnail_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">` : '<div class="flex h-full items-center justify-center text-zinc-600">No Image</div>'}
                            </div>
                            <div class="p-4">
                                <h3 class="font-bold text-lg truncate">${work.project_name}</h3>
                                <p class="text-zinc-400 text-sm truncate mb-4">${work.description}</p>
                                <div class="flex justify-between items-center">
                                    <a href="${work.live_url}" target="_blank" class="text-blue-400 text-sm hover:underline">View Live</a>
                                    <button onclick="deleteWork('${work.id}')" class="text-red-500 text-sm hover:text-red-400 bg-red-500/10 px-3 py-1 rounded">Nuke</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = '<p class="text-red-500">Failed to connect to database.</p>';
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.innerText = 'Transmitting...';
            status.innerText = '';

            const formData = new FormData();
            formData.append('project_name', document.getElementById('projectName').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('live_url', document.getElementById('liveUrl').value);
            formData.append('video_url', document.getElementById('videoUrl').value);
            formData.append('thumbnail', document.getElementById('thumbnail').files[0]);

            try {
                const res = await fetch(API_URL, { method: 'POST', body: formData });
                if(res.ok) {
                    status.innerText = 'Project successfully deployed!';
                    status.className = 'mt-4 text-sm text-center font-medium text-green-400';
                    document.getElementById('uploadForm').reset();
                    fetchWorks();
                } else {
                    throw new Error('Upload failed');
                }
            } catch (err) {
                status.innerText = 'Transmission failed. Check server connection.';
                status.className = 'mt-4 text-sm text-center font-medium text-red-500';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Deploy Project to Database';
            }
        });

        async function deleteWork(id) {
            if(!confirm('Are you sure you want to delete this record?')) return;
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchWorks();
        }

        // Initialize
        fetchWorks();
    </script>
</body>
</html>
